name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil anthropic feedparser googlenewsdecoder

      # The real style example is gitignored (contains client-specific content).
      # A CI stub with the minimal content required by test_style_loader.py is
      # created here so the content-assertion tests pass without the real file.
      - name: Create style example stub for CI
        run: |
          printf 'Bonjour,\n\nSylvain Zawal vous contacte au nom de evertrack.io.\n\nCordialement,\nSylvain Zawal\nCEO - evertrack.io\n' \
            > agents/redacteur_outreach/style_examples/example_default.txt

      - name: Run deploy tests (snapshot fetcher, stdlib only)
        run: python -m unittest discover -s deploy/tests -p "test_*.py" -v

      - name: Run agent unittest suites
        working-directory: agents
        env:
          # Empty key forces fallback-deterministic path in scoring/extraction tests
          ANTHROPIC_API_KEY: ""
        run: python -m unittest discover -s . -p "test_*.py" -v
